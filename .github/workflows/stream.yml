name: Binance Vision Tick Streamer (1h Relay)

on:
  workflow_dispatch:
  schedule:
    # Резервный "сторож" каждый час на 7-й минуте (если прошлую VM внезапно оборвало — простой < 1ч)
    - cron: '7 * * * *'

concurrency:
  group: tick-streamer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir pandas pyarrow websockets huggingface_hub

      - name: Run 55m Tick Streamer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          SYMBOL: "adausdt"
          RUN_SECONDS: "3300"    # 55 минут работы
          FLUSH_SECONDS: "600"   # Сброс на HF каждые 10 минут
        run: python stream_to_hf.py

      - name: Handover to next 55m shift (Self-Restart)
        if: ${{ !cancelled() }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          echo "Запуск следующей смены по эстафете ($WF_FILE)..."
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" || true
