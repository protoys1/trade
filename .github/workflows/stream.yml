name: Binance Vision Tick Streamer (5h)

on:
  workflow_dispatch:
  schedule:
    # Резервный "сторож" на 23-й минуте (вдали от пиковой нагрузки начала часа)
    - cron: '23 */6 * * *'

concurrency:
  group: tick-streamer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # Страховка 5ч 30м
    permissions:
      contents: read
      actions: write      # Разрешает GITHUB_TOKEN запускать следующую смену

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir pandas pyarrow websockets huggingface_hub

      - name: Run 5h Tick Streamer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          SYMBOL: "adausdt"
          RUN_SECONDS: "18000"   # 5 часов работы
          FLUSH_SECONDS: "600"   # Сброс на HF каждые 10 минут
        run: python stream_to_hf.py

      - name: Handover to next 5h shift (Self-Restart)
        if: ${{ !cancelled() }}
        run: |
          echo "Запуск следующей 5-часовой смены по эстафете..."
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
